<!--
  mermaid-js loader
-->

<script src="{{ site.data.assets[origin].mermaid.js | relative_url }}"></script>

<script>
  $(function() {
    /* Soft, low-contrast palette (base theme + themeVariables) for both modes. */
    function mermaidConfig(mode) {
      const dark = (mode === "dark");
      const v = dark ? {
        background: "transparent",
        primaryColor: "#2b3340",
        primaryBorderColor: "#4a5568",
        primaryTextColor: "#d5dbe3",
        lineColor: "#8792a2",
        secondaryColor: "#2b3340",
        tertiaryColor: "#2b3340",
        textColor: "#d5dbe3",
        actorBkg: "#2b3340",
        actorBorder: "#4a5568",
        actorTextColor: "#d5dbe3",
        actorLineColor: "#4a5568",
        signalColor: "#aab4c3",
        signalTextColor: "#d5dbe3",
        labelBoxBkgColor: "#2b3340",
        labelBoxBorderColor: "#4a5568",
        labelTextColor: "#d5dbe3",
        noteBkgColor: "#3a3629",
        noteBorderColor: "#6b6140",
        noteTextColor: "#e6e0c8",
        activationBkgColor: "#2b3340",
        activationBorderColor: "#4a5568",
        sequenceNumberColor: "#2b3340"
      } : {
        background: "transparent",
        primaryColor: "#eef2f8",
        primaryBorderColor: "#c9d3e1",
        primaryTextColor: "#2f3a4a",
        lineColor: "#8a96a8",
        secondaryColor: "#eef2f8",
        tertiaryColor: "#eef2f8",
        textColor: "#2f3a4a",
        actorBkg: "#eef2f8",
        actorBorder: "#c9d3e1",
        actorTextColor: "#2f3a4a",
        actorLineColor: "#d3dae6",
        signalColor: "#5d6b80",
        signalTextColor: "#2f3a4a",
        labelBoxBkgColor: "#eef2f8",
        labelBoxBorderColor: "#c9d3e1",
        labelTextColor: "#2f3a4a",
        noteBkgColor: "#fbf6e6",
        noteBorderColor: "#eadfb4",
        noteTextColor: "#5a5030",
        activationBkgColor: "#eef2f8",
        activationBorderColor: "#c9d3e1",
        sequenceNumberColor: "#eef2f8"
      };
      return {
        theme: "base",
        themeVariables: Object.assign({
          fontFamily: "inherit",
          fontSize: "14px"
        }, v),
        sequence: {
          mirrorActors: false,
          wrap: true,
          width: 150,
          actorMargin: 40,
          messageMargin: 34,
          noteMargin: 12,
          boxMargin: 8,
          useMaxWidth: true
        }
      };
    }

    function updateMermaid(event) {
      if (event.source === window && event.data &&
            event.data.direction === ModeToggle.ID) {

        const mode = event.data.message;

        if (typeof mermaid === "undefined") {
          return;
        }

        let config = mermaidConfig(mode === ModeToggle.DARK_MODE ? "dark" : "light");

        /* Re-render the SVG › <https://github.com/mermaid-js/mermaid/issues/311#issuecomment-332557344> */
        $(".mermaid").each(function() {
          let svgCode = $(this).prev().children().html();
          $(this).removeAttr("data-processed");
          $(this).html(svgCode);
        });

        mermaid.initialize(config);
        mermaid.init(undefined, ".mermaid");
      }
    }

    let initTheme = "light";

    if ($("html[data-mode=dark]").length > 0
      || ($("html[data-mode]").length == 0
        && window.matchMedia("(prefers-color-scheme: dark)").matches ) ) {
      initTheme = "dark";
    }

    let mermaidConf = mermaidConfig(initTheme);

    /* Markdown converts to HTML */
    /* Skip blocks inside a hidden presentation deck (.slides-src) — rendering
       mermaid while its container is display:none produces a broken/tiny SVG.
       presentation.html renders those itself once the deck becomes visible. */
    /* Same for a collapsed <details>: render on first open instead. */
    function convert($pre) {
      let svgCode = $pre.children().html();
      $pre.addClass("unloaded");
      $pre.after(`<div class=\"mermaid\">${svgCode}</div>`);
      return $pre.next(".mermaid");
    }

    $("pre").has("code.language-mermaid").not(function() {
      return $(this).closest(".slides-src").length > 0;
    }).each(function() {
      if ($(this).closest("details").length > 0) {
        return;
      }
      convert($(this));
    });

    mermaid.initialize(mermaidConf);

    $("details").on("toggle", function() {
      if (!this.open) {
        return;
      }
      $(this).find("pre").has("code.language-mermaid").not(".unloaded").each(function() {
        let $div = convert($(this));
        mermaid.init(undefined, $div[0]);
      });
    });

    window.addEventListener("message", updateMermaid);
  });
</script>

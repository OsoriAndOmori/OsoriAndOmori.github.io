<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" rx="10" fill="#f7f6f2"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Token Accumulation &amp; Cost</text>

  <!-- legend -->
  <rect x="40" y="52" width="14" height="14" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="62" y="64" font-size="12" fill="#333">NEW — 이번 질문</text>
  <rect x="190" y="52" width="14" height="14" fill="#8fb0d4" stroke="#333" stroke-width="1.5"/>
  <text x="212" y="64" font-size="12" fill="#333">CUMULATIVE — 이전 대화·응답</text>

  <!-- baseline -->
  <line x1="34" y1="332" x2="470" y2="332" stroke="#999" stroke-width="1"/>

  <!-- API Call 1 -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="44" y="309" width="120" height="19" fill="#8fb0d4"/>
    <rect x="44" y="288" width="120" height="19" fill="#ffffff"/>
  </g>
  <text x="104" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#333">API Call 1</text>
  <text x="104" y="365" text-anchor="middle" font-size="10.5" fill="#777">new question</text>

  <!-- API Call 2 -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="194" y="309" width="120" height="19" fill="#8fb0d4"/>
    <rect x="194" y="288" width="120" height="19" fill="#8fb0d4"/>
    <rect x="194" y="267" width="120" height="19" fill="#8fb0d4"/>
    <rect x="194" y="246" width="120" height="19" fill="#ffffff"/>
  </g>
  <text x="254" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#333">API Call 2</text>
  <text x="254" y="365" text-anchor="middle" font-size="10.5" fill="#777">history + new</text>

  <!-- API Call 3 -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="344" y="309" width="120" height="19" fill="#8fb0d4"/>
    <rect x="344" y="288" width="120" height="19" fill="#8fb0d4"/>
    <rect x="344" y="267" width="120" height="19" fill="#8fb0d4"/>
    <rect x="344" y="246" width="120" height="19" fill="#8fb0d4"/>
    <rect x="344" y="225" width="120" height="19" fill="#8fb0d4"/>
    <rect x="344" y="204" width="120" height="19" fill="#8fb0d4"/>
    <rect x="344" y="183" width="120" height="19" fill="#ffffff"/>
  </g>
  <text x="404" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#333">API Call 3</text>
  <text x="404" y="365" text-anchor="middle" font-size="10.5" fill="#777">더 긴 history + new</text>

  <!-- flow arrows -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <path d="M168 300 L190 300" marker-end="url(#ar)"/>
    <path d="M318 280 L340 280" marker-end="url(#ar)"/>
  </g>

  <!-- cost panel -->
  <line x1="512" y1="332" x2="690" y2="332" stroke="#999" stroke-width="1"/>
  <text x="512" y="352" font-size="11" font-weight="600" fill="#333">COST / TOKENS</text>
  <g stroke="#333" stroke-width="1.5">
    <rect x="520" y="270" width="34" height="62" fill="#8fb0d4"/>
    <rect x="520" y="316" width="34" height="16" fill="#1c1c1c"/>
    <rect x="582" y="222" width="34" height="110" fill="#8fb0d4"/>
    <rect x="582" y="312" width="34" height="20" fill="#1c1c1c"/>
    <rect x="644" y="162" width="34" height="170" fill="#8fb0d4"/>
    <rect x="644" y="306" width="34" height="26" fill="#1c1c1c"/>
  </g>
  <text x="537" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#222">$</text>
  <text x="599" y="214" text-anchor="middle" font-size="17" font-weight="700" fill="#222">$</text>
  <text x="661" y="154" text-anchor="middle" font-size="20" font-weight="700" fill="#222">$</text>
  <path d="M516 300 Q600 250 676 150" stroke="#d9534f" stroke-width="3" fill="none" marker-end="url(#arR)"/>
  <text x="556" y="120" font-size="11" font-weight="700" fill="#d9534f">WARNING: HIGH COST</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9534f"/>
    </marker>
  </defs>
</svg>

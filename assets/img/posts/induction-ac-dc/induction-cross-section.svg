<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" role="img" aria-label="인덕션 코일의 자기장이 용기 바닥 금속박에 와전류를 만드는 단면도">
<rect width="680" height="340" rx="14" fill="#f4f8f6" stroke="#9db8ad"/>
<style>text{font-family:-apple-system,"Noto Sans KR",sans-serif;fill:#1f3a30;font-size:13px}.b{font-weight:700}.f{fill:none;stroke:#2f7fb5;stroke-width:2;stroke-dasharray:6 4}.e{fill:none;stroke:#d6541f;stroke-width:3}</style>
<!-- cup -->
<path d="M225 40 L455 40 L435 170 L245 170 Z" fill="#fffdf4" stroke="#6b5b3a" stroke-width="2.5"/>
<path d="M233 85 L447 85 L435 170 L245 170 Z" fill="#bfe1f2" opacity=".85"/>
<text x="340" y="132" text-anchor="middle" class="b">물 + 라면</text>
<rect x="245" y="168" width="190" height="7" rx="2" fill="#b0b7bd" stroke="#5c6670"/>
<text x="470" y="168">← 바닥의 얇은 금속박</text>
<!-- glass -->
<rect x="130" y="176" width="420" height="18" rx="4" fill="#dfeeea" stroke="#7aa395"/>
<text x="565" y="190">세라믹 상판</text>
<text x="565" y="206">(안 뜨거움)</text>
<!-- coil -->
<g fill="none" stroke="#b8651b" stroke-width="5" stroke-linecap="round">
<path d="M200 235 h280"/><path d="M200 255 h280"/><path d="M200 275 h280"/>
</g>
<text x="500" y="260">← 구리 코일 (20~50kHz 교류)</text>
<!-- field lines -->
<path class="f" d="M270 228 C270 205 275 195 275 180"/>
<path class="f" d="M340 228 C340 205 340 195 340 180"/>
<path class="f" d="M410 228 C410 205 405 195 405 180"/>
<text x="130" y="224" class="b" style="fill:#2f7fb5">자기장 ↕ 초당 수만 번 요동</text>
<!-- eddy -->
<ellipse class="e" cx="310" cy="171" rx="48" ry="5"/>
<ellipse class="e" cx="370" cy="171" rx="35" ry="3.5"/>
<text x="340" y="30" text-anchor="middle" class="b" style="fill:#d6541f">빙글빙글 와전류 → 저항 만나 줄열 🔥</text>
<text x="340" y="320" text-anchor="middle">열은 상판이 아니라 컵 바닥 금속박 "자체"에서 난다</text>
</svg>
